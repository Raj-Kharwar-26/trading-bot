# Trading Bot Nginx Load Balancer Configuration
# Supports: HTTP/HTTPS, WebSocket, Rate Limiting, Health Checks

# Upstream API servers
upstream api_backend {
    least_conn;
    server api-1:8000 max_fails=3 fail_timeout=30s;
    server api-2:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Upstream for Prometheus metrics (single instance to avoid double scraping)
upstream prometheus_backend {
    server api-1:8000;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=analysis_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=trade_limit:10m rate=5r/s;

# Upstream health check
match health_check {
    status 200;
    body ~ "status.*ok";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # Health check endpoint (no rate limiting)
    location /healthz {
        proxy_pass http://api_backend;
        access_log off;
    }

    # Metrics endpoint (scraped from single instance)
    location /metrics {
        proxy_pass http://prometheus_backend;
        allow 172.20.0.0/16;  # Internal network only
        deny all;
    }

    # Analysis endpoints - stricter rate limiting
    location /analyze {
        limit_req zone=analysis_limit burst=5 nodelay;
        proxy_pass http://api_backend;
    }

    location /deep {
        limit_req zone=analysis_limit burst=2 nodelay;
        proxy_pass http://api_backend;
    }

    # Paper trading endpoints
    location /paper/ {
        limit_req zone=trade_limit burst=10 nodelay;
        proxy_pass http://api_backend;
    }

    # Decision log
    location /decisions {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://api_backend;
    }

    # Ingest
    location /ingest {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://api_backend;
    }

    # Default API routes
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://api_backend;
    }

    # WebSocket support for real-time updates (if needed)
    location /ws {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# Prometheus scraping (internal)
server {
    listen 9091;
    server_name localhost;

    location /metrics {
        proxy_pass http://prometheus_backend;
        allow 172.20.0.0/16;
        deny all;
    }

    location / {
        return 404;
    }
}